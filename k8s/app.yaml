apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-management-api
  labels:
    app: task-management-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-management-api
  template:
    metadata:
      labels:
        app: task-management-api
    spec:
      containers:
        - name: api
          image: task-management-api:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: task-management-api
spec:
  selector:
    app: task-management-api
  ports:
    - port: 80
      targetPort: 8080
